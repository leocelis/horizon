[build-system]
# setuptools>=77.0.3 required for the PEP 639 SPDX `license = "MIT"` string form
# below (77.0.0 added license-expression support; 77.0.3 fixed the license-files
# glob/import edge cases). Bumped from >=68 specifically to make that field safe.
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-monitor"
version = "0.3.0"
description = "THCP Fidelity Monitor — 4D conversation dynamics for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Leo Celis"}]
keywords = ["ai", "conversation", "fidelity", "monitoring", "nlp", "spacetime", "mcp", "agent", "observability", "llm", "conversation-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sentence-transformers>=2.2.0,<3",
    "transformers>=4.34,<4.41",
    "numpy>=1.24,<2",
    "dateparser>=1.2.0",
    "tzlocal>=5.0",
]

[project.urls]
Homepage = "https://leocelis.github.io/horizon/"
Repository = "https://github.com/leocelis/horizon"
Issues = "https://github.com/leocelis/horizon/issues"
Changelog = "https://github.com/leocelis/horizon/blob/main/CHANGELOG.md"

[project.optional-dependencies]
geoip = ["geoip2>=4.0"]
nli = ["torch>=2.0", "transformers>=4.30"]
mcp = [
    "mcp>=1.13",
    "click>=8.0",
    "uvicorn>=0.27",
    "starlette>=0.37",
]
langsmith = ["langsmith>=0.1"]
langfuse = ["langfuse>=2.0"]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
arize = ["arize>=7.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24",
]
full = ["horizon-monitor[geoip,nli,mcp,langsmith,langfuse,otel,arize]"]

[project.scripts]
horizon = "horizon_monitor.mcp.cli:main"
horizon-validate = "horizon_monitor.validate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["horizon_monitor*"]

[tool.setuptools.package-data]
horizon_monitor = ["py.typed"]
"horizon_monitor.memento" = ["philosophy.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
