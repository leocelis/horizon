# horizon_memento_mori_intent.yaml
# Intent Artifact for the Horizon Memento Mori plane
#
# IVD: THE FRAMEWORK FOR THE AI AGENTS ERA
# =========================================
# The AI writes this intent artifact, not the human.
# The AI implements against this intent.
# The AI verifies its output against the constraints.
#
# Review history:
#   v0.1  2026-08-18  Initial draft as "Mission Clock" — intent only.
#   v0.2  2026-08-18  Renamed to MEMENTO MORI. Three structural additions from
#                     operator review: (1) the master engagement horizon — a
#                     finite root clock every item discounts against; (2) task
#                     lifespans as TTL tripwires, not estimates; (3) the latency
#                     thesis — goals are chains of entities each with a
#                     measurable latency, and blockers are the slow entities on
#                     the critical path. Research agenda scoped to the latency
#                     thesis. Sequence unchanged: intent → research → PRD →
#                     tech spec → implementation.
#   v0.3  2026-08-18  MONETARY WEIGHTING added under one rule: the engine may
#                     divide by money, never guess money. One root-declared
#                     time_value_rate + caller-supplied amount fields make
#                     cost-of-delay and break-even pure arithmetic; all
#                     financial MODELLING (NPV/IRR/DCF, forecast savings,
#                     currency, tax) is excluded. dates_are_caller_provided
#                     generalised to facts_are_caller_provided so the same
#                     boundary covers dates and amounts; clock_propose_ttl
#                     generalised to clock_propose (one base-rate proposal
#                     mechanism, two uses). Constraint count held at 7.
#   v0.4  2026-08-18  ALTERNATIVES ARE MEASURED, NEVER SIMULATED. Gaps from
#                     operator review folded in: (1) probe item kind — a small,
#                     dated, instrumented trial of an alternative path whose
#                     recorded latencies the engine compares against the
#                     incumbent's; (2) path-vs-path comparison restricted to
#                     recorded latencies (own history or probes); published
#                     base rates admissible only as provenance-labelled
#                     inputs; counterfactuals ("what the untaken path would
#                     have cost") excluded — the incumbent's accruing measured
#                     delay is the honest substitute; (3) division of labour
#                     made explicit: the clock finds the slow block, the agent
#                     layer proposes the replacement, the operator decides;
#                     (4) the plane's own construction is clockable — a
#                     deployment that builds the instrument registers that
#                     build as a mission, so instrumentation-as-deferral is
#                     measured by the instrument itself. Constraints still 7.
#   v0.5  2026-08-18  SIGNAL REDESIGN from research topic B9 (path comparison,
#                     source-audited): at operator scale (n≈5–20, skewed,
#                     serially dependent, continuously peeked) NO inferential
#                     "this path beats that path" claim survives — pilot-size
#                     rules of thumb size a later trial, not a verdict;
#                     sequential/always-valid methods (SPRT, mSPRT, e-values)
#                     control error only by adding a likelihood/betting model
#                     the engine refuses to invent; small-n bootstrap CIs
#                     under-cover. Therefore signal.path_dominated (implied
#                     distributional "beats") is RENAMED signal.path_ahead
#                     with strictly descriptive two-clock semantics, and
#                     signal.probe_ready is frozen as "≥1 completed probe
#                     sojourn (or caller-written count)" — enough to compare
#                     recorded numbers, never a powered test. Comparison lines
#                     must show n, path key, and derivation. Constraints
#                     unchanged at 7.
#   v0.6  2026-08-18  C-BATCH FINDINGS ABSORBED (capture, alert fatigue,
#                     ethics — source-audited) so the intent stays ahead of
#                     the PRD: (1) FIRING SEMANTICS — events are EDGE-
#                     triggered with an acknowledgement state machine
#                     (CLEAR/RAISED/ACKED/ESCALATED/STALE), a per-turn cap,
#                     escalation only on an enumerated NEW recorded fact, and
#                     a shipped alarm-philosophy document; persisting levels
#                     live on clock_status, never re-fire. (2) CAPTURE —
#                     derive events from existing append-only artifacts with
#                     provenance; caller-write the meaning (links, stages,
#                     progress); every stall pairs with a recording-path
#                     check; retrospective timesheets and passive app-hours
#                     rejected as stage latency. (3) ENTITY NAMESPACES —
#                     slot (functional) is the default; person namespace is
#                     explicit and flagged; no person-level ranking anywhere,
#                     including agent suggested_behavior. New non_goal:
#                     people analytics. Constraints unchanged at 7.
#   v0.7  2026-08-18  STRESS TEST (IVD Rule 4) EXECUTED after operator go;
#                     findings folded in as clarifications, not new
#                     constraints: (1) calendar-day arithmetic on
#                     UTC-normalized dates — DST/sub-day offsets never change
#                     a day count; future-dated items clamp to age 0 with a
#                     flag (ASSUMED: UTC-midnight normalization — confirm at
#                     review); (2) degradation is BY OMISSION with an
#                     explanatory field, never by substitution; (3) store
#                     corruption (orphaned parent) fails evaluation loudly;
#                     (4) refusals are TYPED errors naming the rule. Sub-
#                     module intents created (store / engine / signals under
#                     docs/spec/intents/), tech spec and acceptance test plan
#                     written; verification.test_cases populated with worked
#                     examples on the shared synthetic fixture. Status moves
#                     to in_design; implementation remains gated on per-
#                     constraint sign-off.
#   v0.8  2026-08-18  AGENT/MCP INTEGRATION LAYER made explicit (operator
#                     review): two tools added to the interface — clock_ack
#                     (operator-authorized acknowledgement) and
#                     associate_mission (session→mission binding); every
#                     event payload carries a plane tag ("mission" vs
#                     "conversation") so hosts route the LOUD contract
#                     (mission signals are surfaced with numbers) separately
#                     from the fidelity plane's invisibility contract; the
#                     canonical host-rules block lives in
#                     docs/integrations/MEMENTO_MORI_AGENTS.md and is part of
#                     the product surface — capture depends on the
#                     side-effect write rule living in host rules.
#                     Constraints unchanged at 7.
#   v0.9  2026-08-18  POST-IMPLEMENTATION REVIEW fixes (reviewer pass over the
#                     shipped code, all four segments). Four defects closed:
#                     (1) signal.cost_of_delay and signal.breakeven_passed were
#                     registered but never emitted — two of the twelve
#                     documented signals were dead code, justified by a note
#                     claiming the engine computes no per-item MoneyBlock,
#                     which engine.evaluate() does; both predicates now fire
#                     from caller-declared facts only (new config field
#                     cost_of_delay_threshold; breakeven reads a RATIFY event
#                     payload). (2) SlowestEntity.n was hardcoded to 1 while
#                     its derivation stated the true population size —
#                     derivation_on_every_row requires n to BE that size.
#                     (3) A person-namespace winner had its title redacted but
#                     its resolvable item_id still emitted; the id is now
#                     withheld in both report and signal payload. (4) The MCP
#                     boundary silently defaulted the evaluation instant to the
#                     wall clock; the response now carries eval_instant_source
#                     so a defaulted instant is auditable. Sub-module intents
#                     move to status implemented. Constraints unchanged at 7.
#   v1.0  2026-08-19  SLOWEST-ENTITY SEMANTICS CORRECTED AGAINST THE RESEARCH,
#                     plus the duplicate-implementation drift it exposed. The
#                     shipped rule let ANY open sojourn outrank ANY closed one,
#                     so a 1-day open entity was reported "slower" than a
#                     400-day closed one. Research A2 F6 (Kaplan-Meier) is
#                     explicit that an open sojourn is RIGHT-CENSORED — a lower
#                     bound, not a final value — and research B1 keeps "the
#                     constraint-aged open item" as its OWN primitive while
#                     rejecting the collapse of constraint identification into
#                     "name the slowest". Therefore: slowest_entity is now the
#                     argmax over ALL recorded sojourns with an explicit
#                     `censored` flag on an open winner (equal latencies break
#                     toward the open one, whose true value is strictly
#                     greater), and a NEW blocking_entity primitive reports the
#                     oldest OPEN sojourn — "who is blocking now" as a separate
#                     question from "who was slowest". signals.py had kept a
#                     second private copy of the argmax and would have silently
#                     disagreed with the engine after this change; it now
#                     consumes the engine's rows (one implementation, guarded
#                     by a test). The E-4 golden fixture was corrected
#                     accordingly. Also: test plan case M-7 had been listed
#                     without a test existing — written. New engine sub-intent
#                     constraint censored_latency_semantics (conflict_prone,
