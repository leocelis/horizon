# ----------------------------------------------------------------------------
# AUTHORSHIP
# ----------------------------------------------------------------------------
authorship:
  origin: "ai_proposed"
  human_oversight: "review_required"

  ai_authority:
    can_create: false
    can_modify:
      - "implementation"
      - "verification"
    requires_approval:
      - "intent.goal"
      - "intent.success_metric"
      - "constraints"

  escalation: "Any change to the constraints — especially the accounting/estimation boundary, the finite-root rule, and the no-undated-deferral rule — requires human sign-off, because these encode the plane's core thesis"

# ----------------------------------------------------------------------------
# PROBLEM & INVERSION OPPORTUNITIES
# ----------------------------------------------------------------------------
inversion_opportunities:
  problem: |
    AI agents are mission-time blind. They reason competently about the state of
    work (what exists, what is next, what blocks what) but carry no
    representation of calendar time elapsed against outcomes — and no finite
    budget that makes elapsed time COST anything. The observable failure modes:

    - The agent-operator relationship has no horizon. A timeless collaborator
      values a task done today and the same task done in three years
      identically; deferral is free, forever.
    - Work is deferred ("parked", "pending", "revisit later") with a condition
      instead of a date, and nothing is scheduled to re-trigger it. The deferral
      becomes permanent by default.
    - Tasks have no lifespan. Nothing distinguishes a task that is two days old
      from one that has quietly outlived any plausible usefulness window, so
      blockers are discovered by memory, not by expiry.
    - Gates and milestones age silently. "0 of 2 complete" reads identically on
      day 1 and day 40; no instrument reports the 40.
    - External clocks (regulatory dates, market windows, contract deadlines)
      are documented but never paired against internal state, so "the deadline
      passed while the work sat parked" is discovered after the fact.
    - Goal velocity is misattributed. A goal moves at the speed of the slowest
      entity in its serial chain, but no instrument measures per-entity latency
      — so effort flows to the entities that are pleasant to work on rather
      than the ones consuming the calendar, and the slowest entity (which may
      be the operator) is never named.
    - Each new conversation resets the agent's horizon to the session. A
      mission spanning months of sessions has no clock that survives any of
      them.

    Session-scoped conversation monitoring (the existing Horizon plane) cannot
    see this: a month of individually healthy conversations that advance
    nothing is, to a conversation monitor, a month of perfect health.

  dominant_belief: "Agent time-awareness is solved by better scheduling and task tools — calendars, reminders, project trackers that humans read. Progress is measured by tasks completed, and slowness is diagnosed by asking why work feels stuck."

  proposed_inversions:
    - name: "A finite master horizon — the memento mori"
      description: "Every deployment declares exactly one root clock: the engagement horizon between operator and agents — either operator-defined (a date) or lifetime-derived (computed from operator-supplied actuarial inputs). Every clocked item belongs to a tree rooted there, and every elapsed day is expressible as a share of the remaining horizon. Time spent is never free; it is drawn from a finite, visible budget."
      rationale: "Per-task deadlines have no common denominator, so a timeless agent cannot compare the cost of deferral across missions. A finite root horizon is the discount rate that gives every clock below it a shared currency. The caveat is structural: a lifetime horizon ALONE justifies infinite deferral ('plenty of runway'), so the root is only meaningful as the root of a tree whose leaves carry their own windows — never as a standalone number."
      status: "chosen"

    - name: "Task lifespans are TTLs — tripwires, not estimates"
      description: "Every task carries a point-in-time range: the window in which it is expected to complete — its lifespan. Expiry does not mean failure; it means INVESTIGATE — something is blocking, find what. An estimate predicts effort and invites planning around a guess; a TTL detects blockers and invites diagnosis."
      rationale: "The number's purpose is blocker detection, so being 'wrong' about it is informative rather than punishable — which removes the incentive to pad. The accounting/estimation boundary holds: the engine never invents a lifespan from parametric guessing. It MAY propose one derived from execution-derived base rates (recorded actuals of comparable completed tasks in the operator's own store — arithmetic over history, not prediction), and the operator ratifies before it arms."
      status: "chosen"

    - name: "Blockers are slow entities — decompose goals into latencies"
      description: "Model a goal as a chain of entities (people, organizations, processes, systems, the operator), each with a measurable latency derived from recorded stage timestamps: time-in-stage, wait-vs-touch ratio, response latency, cycle length. The goal's velocity is the velocity of the slowest serial entity; the blockers ARE the high-latency entities on the critical path."
      rationale: "This is the plane's central thesis and the subject of its dedicated research phase. Prior art the research must test it against rather than reinvent: Theory of Constraints (improving anything but the constraint is invisible at the goal), lean value-stream mapping (touch time is routinely a small fraction of lead time — elapsed calendar lives in the waits between actions), Little's Law (with fixed throughput, lead time scales linearly with work-in-progress — arithmetic, not opinion), and sales-velocity models (cycle length is the denominator; trust is a latency — N contacts spaced over M weeks — not a quality). Two obligations fall out: (1) latencies must be classifiable as reducible, irreducible, or self-imposed — effort on irreducible latencies is waste, and unspent effort on self-imposed ones is the silent killer; (2) the instrument MUST be able to name the operator as the slowest entity. An instrument that can only attribute slowness to external entities is a comfortable instrument, and comfortable instruments are decoration. The classification itself is semantic judgment and belongs to the operator (or an operator-configured judge) — the engine measures the latencies; it never opines on their meaning."
      status: "chosen"

    - name: "Alternatives are measured, never simulated"
      description: "When a slow block is named, the question becomes: is there a faster path? The plane answers it only with recorded numbers, in strength order: (1) the operator's own history — recorded latencies of each path where both have been used; (2) probes — a first-class item kind: a small, dated, instrumented trial of the alternative whose stage timestamps let the engine compare measured latency against measured latency; (3) published base rates — admissible only as provenance-labelled inputs ('the literature says'), never blended with measured values. What the plane never produces is a counterfactual: 'what the untaken path would have cost' is an invented number. The honest substitute is automatic: the incumbent path keeps accruing measured delay from the moment an alternative is registered, so the untaken option's case strengthens in real numbers, not projections."
      rationale: "Comparing an untried path by prediction is duration estimation wearing a route map. Probes convert the comparison from forecast to measurement — the operator is not predicting which path is faster, they are finding out, small and instrumented. This is the only way 'find a better way' fits inside a deterministic accounting engine."
      status: "chosen"

    - name: "The clock finds the block; the agent proposes the fix; the operator decides"
      description: "Three layers with hard edges. The ENGINE (deterministic) measures latencies and names the slowest entity. The AGENT LAYER (semantic, reading the clock report each turn) proposes replacements and better ways — reroute, delegate, drop, probe — as suggestions with the clock's numbers attached. The OPERATOR decides, and every decision that spawns a path becomes new clocked items the engine measures. The engine never proposes; the agent never measures; the operator is never bypassed."
      rationale: "Proposing a workaround is judgment, and judgment was deliberately kept out of the engine. But the plane's value is only realised when someone acts on the named block, so the intent must state where proposal lives rather than leave a gap between measurement and action: the agent consuming the per-turn signal IS the proposal layer, by design and not by accident."
      status: "chosen"

    - name: "Money is a weight on time, never a subsystem"
      description: "The plane accepts one operator-declared rate (currency per unit time) at the root and caller-supplied amounts on items, and computes cost-of-delay, money-weighted urgency, and break-even DATES from them. It performs no financial modelling: no NPV/IRR/DCF, no discount-rate selection, no currency conversion, no tax, no forecast of savings that were not measured."
      rationale: "Without any price, the plane can rank what is slowest but never what is costliest-slow, and those diverge sharply — an hour of latency on a high-value path outranks weeks of latency on a hobby. Ranking without a weight is the 'comfortable instrument' failure in another disguise. But money is also where a time instrument goes to die: the moment it selects a discount rate or projects unmeasured savings it is inventing numbers, which is the duration-estimation sin in different units. The boundary that resolves both: the engine may DIVIDE BY money, never GUESS money. Review test for any proposed feature — if it would still make sense with the clock removed, it belongs in a finance tool, not here."
      status: "chosen"

    - name: "Elapsed-time accounting, not estimation"
      description: "The system never predicts how long work will take. It records dates and timestamps supplied by callers and computes only arithmetic on them: ages, days-remaining, days-since-last-progress, per-entity latency, progress-per-day, share-of-remaining-horizon. Accounting is measurement; estimation is judgment, and judgment stays with the human."
      rationale: "Model-invented duration estimates are unfounded numbers that invite planning around a guess. Elapsed time is a fact — and it is precisely the fact no agent currently surfaces. Splitting the two makes the safe half automatable without importing the unsafe half. TTL proposals from execution-derived base rates sit on the accounting side of the line: they are arithmetic over the operator's own recorded history, surfaced as proposals and inert until ratified."
      status: "chosen"

    - name: "Mission-scoped, not session-scoped"
      description: "The unit of analysis is the mission — a goal with a clock inside the horizon tree — persisted in a local store that outlives every conversation, process, and agent. Sessions read from and write to the store; none of them owns it."
      rationale: "The failure lives across sessions. Any instrument that resets per conversation is structurally blind to a 60-day stall distributed over 40 healthy sessions."
      status: "chosen"

    - name: "Alarm on age, not on anomaly"
      description: "Conversation monitors stay silent while the conversation is healthy. This plane inverts the silence condition: its events fire on the passage of time itself — a TTL past its window, a deferral past its revisit date, a gate exceeding its age budget, a deadline inside its warning window, an entity latency dominating a critical path, a mission with zero recorded progress for N days. Nothing anomalous needs to happen; enough nothing IS the signal."
      rationale: "Time-blindness is a failure of omission. No engine that triggers on what occurred can catch what failed to occur; only a clock compared against a calendar can."
      status: "chosen"

    - name: "An undated deferral is invalid, not incomplete"
      description: "The write path rejects any deferral (park, pause, 'revisit when...') that lacks a concrete revisit date. This is schema validation, not advice."
      rationale: "A deferral with a condition and no date is how missions die politely. Making the date structurally mandatory converts a discipline problem into a type error."
      status: "chosen"

    - name: "Signals into the agent's existing turn loop, not a dashboard"
      description: "Clock events are delivered through the same signal channel agents already consume each turn (Horizon's active_events / suggested_behavior contract), so the calendar reaches the agent at planning time — not a human-facing report the operator must remember to read."
      rationale: "Dashboards and digest emails depend on the human polling them; the failure mode under measurement is precisely that nobody polls. The one surface guaranteed to be read is the agent's own turn context."
      status: "chosen"

    - name: "Put it in the project tracker (per-project tooling)"
      description: "Encode deadlines, lifespans, and latencies inside each project's own task tracker, board, or goal scripts."
      rationale: "Rejected: per-project implementations are rebuilt for every project, encode project-specific IDs, and reach agents only if each integration is separately wired. The capability is generic (dates, ages, latencies, arithmetic, events) and belongs one level above any project."
      status: "rejected"

    - name: "LLM-judged progress"
      description: "Have a model read recent activity and judge whether the mission is 'really' progressing."
      rationale: "Rejected: reintroduces non-determinism and cost into a measurement layer, and progress judgment is exactly the semantic question the operator should answer by recording a progress event. The engine's job is arithmetic on records, not opinion about them. (Latency CLASSIFICATION — reducible/irreducible/self-imposed — is likewise semantic and likewise excluded from the engine: it is operator- or judge-supplied metadata the engine stores and reports, never computes.)"
      status: "rejected"

    - name: "Standalone product/repository"
      description: "Build the plane as a new independent project."
      rationale: "Rejected: the delivery channel (per-turn signal contract), storage, MCP server, config, and deployment scaffolding already exist in Horizon; a separate project duplicates all of it and starts with zero integrations. This is a second measurement plane over a different object (mission vs conversation), same philosophy: external, deterministic, signals-only. If post-research scope proves the plane outgrows its host, it is separable then — packages, not premature repos."
      status: "rejected"

# ----------------------------------------------------------------------------
# INTERFACE (sketch — final shape belongs to the tech spec)
# ----------------------------------------------------------------------------
interface:
  type: "api"

  tools:
    - name: "clock_register"
      description: "Create or update a clocked item: the root horizon (exactly one per store), mission, task (with TTL window), deadline, gate, entity, or deferral. Deferrals without revisit_date are rejected. Items without a path to the root are rejected."
      parameters:
        - name: "item"
          type: "object"
          required: true
          description: "kind (horizon|mission|task|deadline|gate|entity|deferral|probe) + dates/windows + parent link into the horizon tree. A probe is a small, dated, instrumented trial of an alternative path toward its parent mission; it carries a TTL like any task and its stage timestamps feed path comparison. Entities default to a SLOT namespace (functional label: role, queue, system); a person namespace is explicit, flagged as personal data, and excluded from rankings and shareable surfaces"
      returns: "item_id"

    - name: "clock_progress"
      description: "Record a progress or stage-transition event against an item (caller-supplied fact: 'X happened on date D', 'stage S entered/exited on date D'). Stage timestamps are the raw material of latency accounting. CAPTURE MODEL: events may be DERIVED from existing append-only artifacts (commits, tracker transitions, sends) with mandatory provenance (source system, native id, raw timestamp — bitemporal: artifact time vs learned time); the MEANING (link to mission, stage labels, wait-vs-touch, what counts as progress) is always an explicit caller write, human or agent, through this same validated path — never a silent inference. Retrospective timesheet reconstruction and passive app-hours are rejected as stage latency. Every stall evaluation pairs with a recording-path check distinguishing 'no work' from 'no capture'."
      parameters:
        - name: "item_id"
          type: "string"
          required: true
        - name: "event"
          type: "object"
          required: true
      returns: "ack"

    - name: "clock_status"
      description: "Compute the full clock surface: every item with its age, days-remaining, TTL state, days-since-last-progress, per-entity latency (time-in-stage, wait-vs-touch), slowest-entity per mission, share-of-remaining-horizon, and path comparison — recorded latencies of alternative paths (probes, prior history) toward the same mission side by side with the incumbent path's, including the incumbent's delay accrued since the alternative was registered. Comparison is only ever between recorded latencies; the engine simulates nothing. Pure read; deterministic; sorted by urgency."
      parameters:
        - name: "scope"
          type: "string"
          required: false
      returns: "clock report (plain dict)"

    - name: "clock_ack"
      description: "Acknowledge a fired signal for (item, signal_type). Operator-authorized: agents call it only on the operator's explicit acknowledgement, never to self-quiet a signal. Moves the state machine to ACKED (visible on clock_status, silent per-turn until an enumerated escalation rung)."
      parameters:
        - name: "item_id"
          type: "string"
          required: true
        - name: "signal_type"
          type: "string"
          required: true
        - name: "actor"
          type: "string"
          required: true
      returns: "ack"

    - name: "associate_mission"
      description: "Bind a session to a mission on the session registry so the mission's due events (post-cap) reach that session's process_turn. Without association a configured store emits nothing into the session."
      parameters:
        - name: "session_id"
          type: "string"
          required: true
        - name: "mission_id"
          type: "string"
          required: true
      returns: "ack"

    - name: "clock_propose"
      description: "Derive a proposal from execution-derived base rates over comparable records in this store. kind=ttl proposes a task lifespan window; kind=breakeven proposes a break-even date for a latency-reducing purchase from measured before/after latency, caller-supplied cost, and the root time_value_rate. Returns the proposal with its derivation shown; inert until the operator ratifies it via clock_register."
      parameters:
        - name: "item_id"
          type: "string"
          required: true
        - name: "kind"
          type: "string"
          required: true
          description: "ttl | breakeven"
      returns: "proposal {value, sample_size, derivation} — never auto-applied"

  signal_channel: |
    Clock events surface through the existing per-turn signal contract
    (process_turn → active_events[].suggested_behavior) when a session is
    associated with one or more missions (associate_mission). Every event
    payload carries plane: "mission"; hosts apply the LOUD contract to this
    plane — mission signals are surfaced to the operator with their numbers
    and derivation — while the conversation plane keeps its invisibility
    contract. Canonical host rules: docs/integrations/MEMENTO_MORI_AGENTS.md.

    FIRING SEMANTICS (normative, from alarm-fatigue research): events are
    EDGE-triggered — an event fires once when its predicate becomes true,
    never again per-turn while the condition persists (persisting levels are
    visible on clock_status). Acknowledgement state machine per (item, type):
    CLEAR → RAISED (fires once) → ACKED (silent, visible) → ESCALATED (fires
    once, only on an enumerated NEW recorded fact — a higher threshold rung,
    a tighter window, an expiry after ack; never "another turn happened") →
    STALE (optional low tier, once). At most ONE new RAISED/ESCALATED event
    per associated turn, preempted only by a higher-priority class. A signal
    must admit a possible action this turn; otherwise it is status. The
    deployment ships an alarm-philosophy document (signal definition, owner,
    priorities, state machine, cap, ack authority, escalation-fact enum,
    KPIs, recording-path coupling).

    Event types (final list belongs to the PRD):
      signal.ttl_expired           — a task outlived its ratified lifespan: investigate the blocker
      signal.deferral_expired      — a park is past its revisit date
      signal.gate_aging            — a gate exceeded its age budget with no progress
      signal.deadline_window       — an external deadline entered its warning window
      signal.mission_stalled       — zero progress events for N days
      signal.slowest_entity        — one entity's latency dominates a mission's critical path
      signal.clock_unpaired        — a deadline exists with no linked internal state
      signal.horizon_share         — an item's elapsed time crossed a threshold share of the remaining master horizon
      signal.cost_of_delay         — accrued cost-of-delay on an item crossed an operator-set threshold (fires only when a rate and an amount are both declared)
      signal.breakeven_passed      — a ratified break-even date passed without the measured latency improvement that justified it
      signal.probe_ready           — at least one completed probe sojourn is recorded (or a caller-written count is reached): enough to put numbers side by side, never a powered test
      signal.path_ahead            — descriptive two-clock predicate on these records only: the probe's recorded sojourn is shorter than the incumbent's accrued delay since the alternative was registered (or than each of the incumbent's recorded sojourns in a frozen set); every firing carries n per path and the derivation. The plane never emits an inferential "path A beats path B" distributional claim — no p-value, CI, posterior, or sequential/always-valid test on path latencies (research topic B9)

# ----------------------------------------------------------------------------
# INTENT
# ----------------------------------------------------------------------------
intent:
  summary: "Memento Mori: a finite-horizon mission plane for Horizon — a master engagement clock, TTL tripwires on every task, and latency accounting over the entities a goal depends on — delivered as per-turn signals so agents plan inside the calendar instead of outside it"
  goal: |
    Extend Horizon with a second measurement plane whose object is the mission,
    not the conversation, organized as a tree under one finite root:

    THE ROOT — a single master engagement horizon per store (operator-defined
    date, or lifetime-derived from operator-supplied inputs). Every item
    descends from it; every elapsed day is expressible as a share of what
    remains. The root is what makes time cost something.

    THE LEAVES — clocked items with operator-supplied dates and windows:
    - missions with progress events and stall thresholds
    - tasks with TTL lifespans (ratified windows whose expiry means
      "investigate the blocker", never "punish the estimate")
    - deadlines paired to the internal state they gate
    - gates with age budgets
    - deferrals with mandatory revisit dates
    - entities with stage timestamps from which latency is derived
    - probes: small, dated, instrumented trials of alternative paths, TTL'd
      like tasks, whose recorded latencies feed path comparison

    THE ARITHMETIC — ages, days-remaining, TTL state, days-since-progress,
    progress-per-day, time-in-stage, wait-vs-touch ratio, slowest-entity per
    mission, share-of-remaining-horizon. Nothing else: the engine's entire
    intelligence is arithmetic, ordering, and thresholds over caller-supplied
    records.

    THE PATHS — when the clock names a slow block, alternatives are compared
    only between recorded latencies: the operator's own history where both
    paths have been used, or probes run small and instrumented. Published
    base rates enter only as provenance-labelled inputs. No counterfactuals:
    from the moment an alternative is registered, the incumbent path's
    accruing measured delay is the running argument for or against it.

    THE WEIGHT (optional) — one operator-declared time_value_rate at the root
    plus caller-supplied amount fields on items (cost, value_at_stake) let the
    same arithmetic answer which latency is worth attacking: accrued
    cost-of-delay, money-weighted urgency ordering, and break-even expressed
    as a DATE. Ranking by pure elapsed time identifies what is slowest;
    ranking with a weight identifies what is costliest-slow, and those
    diverge. Money never becomes a subsystem: it enters only as a multiplier
    on time arithmetic, and the plane behaves identically without it.

    THE SIGNALS — events fire on clock states (expiries, aging, windows,
    stalls, dominant latencies, unpaired clocks) through the same channel
    agents already read every turn, so elapsed calendar time becomes an input
    to planning rather than a retrospective discovery.

    The plane inherits Horizon's philosophy wholesale: external observer,
    deterministic, local-first, framework-agnostic, signals-only. It measures
    and reports; the agent's controller and the human decide.

    Explicitly bounded: elapsed-time ACCOUNTING, never duration ESTIMATION.
    The engine contains no model of how long work should take and generates no
    forecasts. TTL proposals are arithmetic over the operator's own recorded
    actuals, shown with their derivation, and inert until ratified. Latency
    classification (reducible / irreducible / self-imposed) is semantic
    judgment: stored and reported by the engine, supplied only by the operator
    or an operator-configured judge.
  success_metric: |
    Primary: the instrument shortens time-to-next-irreversible-external-action.
    In monitored missions, the interval between a clock event (TTL expiry,
    deferral expiry, stall, slowest-entity) and the next recorded externally
    visible action on that mission is measured and bounded; an instrument whose
    signals do not shorten that interval versus baseline has failed its own
    thesis and must say so. (Guardrail: the plane must never become the work it
    was built to unblock — instrumentation-as-deferral is its named failure
    mode.)

    Secondary:
    - No expired TTL or deferral goes unsurfaced past its next associated session
    - Zero undated deferrals and zero root-less items representable in the store (schema-enforced)
    - Every deadline is either paired to internal state or flagged signal.clock_unpaired within one evaluation
    - A mission with no progress events for its threshold fires signal.mission_stalled in the next associated turn
    - Latency accounting reproduces the operator's known bottlenecks in retrospective replay: given historical stage timestamps, the slowest-entity computation identifies the entity the operator independently names as the blocker (validation exercise for the research phase)
    - Clock computation is reproducible: identical store + identical evaluation date → byte-identical report
  stakeholders:
    - "AI agent builders whose agents plan multi-week or multi-month work"
    - "Operators running long-horizon goals across many agent sessions"
    - "Teams pairing external deadlines (regulatory, contractual, market) with agent-driven execution"

# ----------------------------------------------------------------------------
# RESEARCH AGENDA (the phase that follows sign-off of this intent)
# ----------------------------------------------------------------------------
research_agenda:
  thesis_under_test: "Goal non-achievement is dominated not by absent deadlines (deadlines are the detection instrument) but by slow-paced entities in the goal's serial chain — latencies that can be decomposed, measured in time units, classified (reducible / irreducible / self-imposed), and selectively attacked."
  bodies_of_prior_art:
    - "Theory of Constraints / Critical Chain (constraint focus; buffer burn as health signal)"
    - "Lean value-stream mapping (lead time vs touch time; wait-dominance of elapsed calendar)"
    - "Queueing theory / Little's Law (WIP–lead-time coupling under fixed throughput)"
    - "Sales-velocity and trust-latency models (cycle length as denominator; trust as contact cadence over calendar)"
    - "Critical path method (serial chains; slack; what dominance means for effort allocation)"
  deliverable: "Source-audited research doc extracting the measurable primitives (time-in-stage, wait-vs-touch, latency classification, WIP coupling, buffer burn) and testing the thesis against each body; primitives that survive become the PRD's metric set"
  validation_note: "Retrospective replay against real historical mission data (operator-supplied, private, never bundled) is the research phase's external oracle: the instrument must re-discover known bottlenecks from timestamps alone."

# ----------------------------------------------------------------------------
# CONSTRAINTS
# Ordered least → most critical (position bias: models weight later constraints
# more heavily; the plane's thesis constraints are last).
# Held at the 7-constraint IVD budget; the root-horizon and TTL sub-mechanisms
# get their own sub-module intents at tech-spec time (see scope.note).
# All test paths are PLANNED — implementation does not exist yet. Per IVD Rule 3,
# ai_generated provenance alone cannot mark a constraint PASS; each will need a
# human-authored assertion or execution-derived oracle before verification.
# ----------------------------------------------------------------------------
constraints:
  - name: "optional_plane_backward_compat"
    requirement: "With no mission store configured, every existing Horizon API behaves byte-identically to the pre-plane release; enabling the plane requires explicit configuration"
    test: "tests/unit/memento_mori/test_plane_optional.py::test_no_store_no_behavior_change"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 3
    assumption_status: "KNOWN"
    consequence_if_violated: "Existing integrations break or silently change behavior on upgrade; adoption of the plane becomes mandatory instead of chosen"

  - name: "local_first_privacy"
    requirement: "The mission store is a local file/database at an operator-configured path; default configuration sends zero mission data to external services; the engine ships with no bundled mission data of any kind"
    test: "tests/unit/memento_mori/test_privacy.py::test_no_external_calls_and_no_bundled_data"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 2
    assumption_status: "KNOWN"
    consequence_if_violated: "Mission data (goals, deadlines, latencies of named entities) is inherently sensitive; any leak or bundled example breaks the trust the plane depends on"

  - name: "deterministic_no_llm_core"
    requirement: "The clock evaluation path makes zero LLM calls and zero network calls; identical store contents plus identical evaluation timestamp produce a byte-identical report; semantic judgments (latency classification, progress meaning) enter the store only as caller-supplied metadata"
    test: "tests/unit/memento_mori/test_determinism.py::test_reproducible_report"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 2
    assumption_status: "KNOWN"
    consequence_if_violated: "A non-deterministic clock cannot be trusted as a measurement layer, and per-turn cost/latency would make always-on evaluation impractical"

  - name: "signals_not_control"
    requirement: "The plane never blocks, modifies, or generates agent behavior; its only outputs are the clock report (pure read), TTL proposals (inert until ratified), and typed events with suggested_behavior text through the existing signal contract"
    test: "tests/unit/memento_mori/test_signals_only.py::test_no_control_surface"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 2
    assumption_status: "KNOWN"
    consequence_if_violated: "A clock that enforces becomes a scheduler with opinions; measurement and decision collapse into one layer and the framework-agnostic contract breaks"

  - name: "mission_scope_persistence"
    requirement: "Clocked items persist across sessions, processes, and agent restarts; a session's end, reset, or crash never deletes or ages-out an item; only explicit caller writes change the store"
    test: "tests/unit/memento_mori/test_persistence.py::test_items_survive_session_lifecycle"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    consequence_if_violated: "The plane degenerates into session scope — the exact blindness it exists to remove"

  - name: "finite_rooted_tree"
    requirement: "Every store contains exactly one root item of kind=horizon carrying a finite end date (operator-defined or derived by arithmetic from operator-supplied inputs); every other item must carry a parent path terminating at the root; writes violating either rule are rejected with a schema error"
    test: "tests/unit/memento_mori/test_horizon_tree.py::test_single_finite_root_and_rooted_items"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    consequence_if_violated: "Without a finite root, elapsed time has no cost and the plane reverts to a pile of unrelated timers; without rooted items, share-of-horizon accounting is uncomputable"

  - name: "facts_are_caller_provided"
    requirement: "The engine never generates, estimates, or infers a duration, a future date, or a monetary amount from anything except arithmetic over caller-supplied records; every stored date, rate, and amount originates from a caller write; proposals (kind=ttl, kind=breakeven) must expose their derivation (source records, sample size, arithmetic) and are never applied without an explicit ratifying write; an undated deferral is rejected at the schema with no configuration override; monetary outputs are limited to products, sums, and quotients of stored amounts, the stored rate, and stored/derived durations — no discounting, no amortisation schedules, no forecast of unmeasured savings, no currency conversion"
    test: "tests/unit/memento_mori/test_no_invention.py::test_engine_emits_no_invented_dates_amounts_or_durations"
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    consequence_if_violated: "The plane crosses from accounting into estimation — fabricated numbers with the authority of measurement, the most dangerous possible failure of a clock. In money units the same failure is worse: an invented saving or a selected discount rate produces a confident financial verdict on a purchase or a mission that nothing measured supports. Undated deferrals reintroduce the single failure mode most responsible for silent mission death"

constraint_satisfiability:
  analysis: |
    Seven constraints. Tensions examined:
    - signals_not_control vs schema rejections (finite_rooted_tree,
      facts_are_caller_provided): rejecting a write is validation of the
      plane's OWN store, not control of agent behavior — the agent remains
      free to do anything except record an invalid item in this store. Not a
      conflict.
    - facts_are_caller_provided vs monetary weighting: cost-of-delay,
      money-weighted ordering and break-even dates are products/quotients of
      stored amounts, the stored rate, and stored/derived durations. No
      output may contain an amount not so derivable, and the plane must
      compute every non-monetary output identically when no rate is declared.
      Encoded in the joint test.
    - facts_are_caller_provided vs path comparison: comparison outputs contain
      only latencies computed from stored stage timestamps of really-run paths
      (incumbent, probes, prior history) — no synthetic path latency may
      appear anywhere. Published base rates surface as separate,
      provenance-labelled fields, never merged into measured columns.
      Encoded in the joint test.
    - facts_are_caller_provided vs clock_propose: proposals are arithmetic
      over stored records with derivation shown, inert until a ratifying
      caller write. The boundary: no stored date may exist that is not
      traceable to a caller write; no output date may exist that is not
      derivable by arithmetic from stored dates + evaluation time. Encoded in
      the joint test.
    - finite_rooted_tree vs optional_plane_backward_compat: the root
      requirement binds stores, not deployments — no store, no plane, no
      change. Not a conflict.
    - deterministic_no_llm_core vs latency classification: classification is
      caller-supplied metadata; the engine stores and reports it, never
      computes it. Not a conflict.
    All seven are jointly satisfiable.
  joint_satisfaction_test: "tests/unit/memento_mori/test_joint_satisfaction.py::test_all_constraints_on_same_flow"
  note: "Single test driving one flow — configure store, register finite root, register mission+deadline+gate+entity under it, attempt root-less item (rejected), attempt undated deferral (rejected), request TTL proposal (derivation shown, not applied), ratify TTL, declare a time_value_rate and an amount, assert cost-of-delay and
    break-even derive only from stored facts, assert every non-monetary output is
    identical with the rate removed, advance evaluation date past TTL and revisit
    dates, assert events fire, register a probe and a second path, assert the
    comparison contains only measured latencies with base-rate fields separate, assert report reproducible byte-identically, assert zero network/LLM, assert unconfigured session unchanged — asserting all seven constraints on the SAME output."

# ----------------------------------------------------------------------------
# NON-GOALS
# ----------------------------------------------------------------------------
non_goals:
  - "Duration estimation, effort sizing, or completion forecasting of any kind — TTL proposals are base-rate arithmetic with shown derivation, not predictions"
  - "Task management: the plane is not a todo list, tracker, or scheduler; it clocks items that live wherever the operator manages work"
  - "Judging whether recorded progress is 'real' progress, or whether a latency is reducible — semantic judgment stays with the operator and their agents"
  - "Financial modelling: no NPV, IRR, discounted cash flow, discount-rate selection, amortisation schedules, currency conversion, tax, budgeting, or portfolio optimisation. Monetary outputs are limited to cost-of-delay, money-weighted ordering, and break-even dates computed by arithmetic from caller-supplied amounts, the caller-declared rate, and measured durations"
  - "People analytics: entity latency is operator wait accounting on functional slots — never a person-level responsiveness score, percentile, ranking, or solely automated allocation/blame from latency; agents must not rank people in suggested_behavior; mortality-salience priming is excluded (finite-horizon framing is opt-in arithmetic on an operator-typed date)"
  - "Counterfactual accounting: the plane never states what an untaken path would have cost; it compares recorded latencies and lets the incumbent's accruing measured delay speak"
  - "Purchase advice: the plane validates a latency-reducing purchase retrospectively against measured before/after latency; it never recommends a purchase from projected savings"
  - "Actuarial modeling: a lifetime-derived root horizon is computed by arithmetic from operator-supplied inputs (e.g. an operator-chosen expectancy table value); the engine embeds no demographic model and no personal data"
  - "Conversation-level temporal signals (inter-turn gaps, retention, pacing) — already owned by the existing spacetime plane"
  - "Calendar/scheduling integration (creating events, sending reminders to humans) — the delivery surface is the agent's turn context, by design"
  - "Multi-user/multi-tenant coordination — V1 is single-operator, local-first; sharing surfaces are a later, separate decision"

# ----------------------------------------------------------------------------
# RISKS
# ----------------------------------------------------------------------------
risks:
  - risk: "Instrumentation-as-deferral: building and tuning the clock becomes the activity that defers the highest-latency pending action"
    mitigation: "Named in the primary success metric: the plane justifies itself only by shortening time-to-next-irreversible-external-action, and must report its own failure if it does not"
  - risk: "Signal fatigue: aging events fire every associated turn and get tuned out"
    mitigation: "Resolved normatively in v0.6 signal_channel firing semantics: edge-triggered events, acknowledgement state machine, one-new-fire-per-turn cap, escalation only on an enumerated new recorded fact, and a shipped alarm-philosophy document; an acknowledged event stays visible in clock_status but stops firing per-turn"
  - risk: "Garbage clock: callers stop recording progress/stage events, so stall and latency signals fire on missions that are actually moving"
    mitigation: "Make progress recording writable by agents (not only humans) so ordinary agent work logs the fact; persistent false stalls are surfaced in clock_status as a recording-path check"
  - risk: "Comfortable instrument: latency attribution flows only to external entities, never the operator"
    mitigation: "The operator is a first-class entity in the chain model; the slowest-entity computation runs over ALL entities including the operator; the research phase's retrospective-replay oracle must include at least one case whose known bottleneck was operator-side"
  - risk: "TTL windows rot into padding or pressure"
    mitigation: "Expiry semantics are fixed as 'investigate', never 'punish'; proposals come from base rates, not negotiation; both live in the schema documentation as normative language"
  - risk: "The finite root horizon is emotionally heavy (it is a mortality clock when lifetime-derived)"
    mitigation: "The root is operator-chosen in kind and in value; lifetime derivation is opt-in arithmetic over operator-supplied inputs; the engine never suggests or defaults to it"
  - risk: "Money turns the plane into a finance tool"
    mitigation: "Money is admissible only as a multiplier on time arithmetic; review test for any proposed feature — if it would still make sense with the clock removed, it belongs in a finance tool and is rejected. The rate is optional: with none declared, every non-monetary output is unchanged"
  - risk: "A declared time_value_rate is itself a guess, and lends invented authority to every figure derived from it"
    mitigation: "The rate is caller-declared, never engine-proposed; every monetary output must be traceable to it in the shown derivation so a wrong rate is visibly a wrong INPUT rather than a wrong measurement; research topic B8 scopes what makes a defensible rate"
  - risk: "Probe theater: running probes becomes another form of deferral — always testing alternatives, never switching"
    mitigation: "A probe is TTL'd like any task and belongs to a mission; an expired probe fires signal.ttl_expired like anything else, and probe count per mission is visible in clock_status so a mission accumulating probes without decisions is itself a named pattern"
  - risk: "Self-exemption: work on the instrument absorbs the calendar its missions needed, and the instrument does not see it because its own build is not clocked"
    mitigation: "A deployment that builds or extends the plane registers that build as a mission in its own store, with the same TTLs, stall thresholds, and horizon-share accounting as everything else — the clock clocks its own construction"
  - risk: "Scope creep toward a project-management product"
    mitigation: "non_goals list above is normative; anything resembling task management is rejected at review"
  - risk: "The plane widens Horizon's public thesis (conversation property → mission property)"
    mitigation: "Position as a sibling plane under the same philosophy — external deterministic observer, signals-only — over a different object; the PRD owns the narrative reconciliation"

# ----------------------------------------------------------------------------
# VERIFICATION (protocol for the implementation phase)
# ----------------------------------------------------------------------------
verification:
  protocol: |
    Per IVD Rule 2, after any implementation derived from this intent:
    1. Re-read this artifact from disk
    2. Diff each change against each of the 7 constraints
    3. Run every constraint's test; ai_generated tests alone cannot mark PASS —
       each constraint needs a human-authored assertion or an execution-derived
       oracle (e.g. golden clock-report fixtures, retrospective-replay fixtures)
       before it clears
    4. Report each_constraint_pass + joint_satisfaction_pass (required: 7 >= 3)
    Implementation must be segmented (7 constraints → IVD Rule 1 mandatory
    segmentation), suggested segments: (a) store + horizon tree + schema
    validation, (b) evaluation/arithmetic engine incl. latency accounting,
    (c) proposal path (ttl + breakeven), (d) monetary weighting,
    (e) probes + path comparison, (f) signal integration (edge/ack state
    machine, cap, philosophy) + compat, (g) artifact adapters (derived
    events with provenance) + recording-path check.
  test_cases:
    - id: "worked-example-clock"
      given: "Synthetic fixture smallco (test plan): root ends 2030-01-01; mission created 2026-06-01 with last progress 2026-07-02; task TTL to 2026-07-20; deferral revisit 2026-08-10; evaluation 2026-08-18"
      expect: "mission age 78d; days_since_progress 47d (stalled); TTL expired; deferral expired by 8d; horizon share ~0.0595 (78/1310) crossing the 0.05 rung — all as calendar-date arithmetic with derivations shown"
    - id: "worked-example-signals"
      given: "Same fixture; at least 4 due edges on first evaluation; per-turn cap 1"
      expect: "exactly one event (P1 ttl_expired); remainder in report; second evaluation with no state change emits nothing; ack silences until an enumerated rung"
    - id: "worked-example-money-identity"
      given: "C_s=600, rate=50/h, T_s=4h, delta_t=2h/cycle, lambda=0.5 cycles/day"
      expect: "break-even = evaluation date + 16 days, derivation traceable; removing the rate leaves every non-monetary byte identical"
    - id: "worked-example-path"
      given: "Probe sojourn 4d completed; alternative registered 17d before evaluation; incumbent still open"
      expect: "path_ahead fires once, payload carries both intervals with n=1 and derivation; no p-value or CI field exists in the schema"
    - id: "counter-example-rejections"
      given: "Writes: deferral without revisit date; second root; root-less item; person-namespace entity without flag. Requests: NPV, forecast delta_t, counterfactual sojourn"
      expect: "every write rejected atomically with a typed schema error; every request answered with a typed refusal naming the rule; store byte-identical after failures"

review_gate:
  status: "PENDING_SIGNOFF"
  note: "Operator go to proceed with all pre-implementation artifacts recorded 2026-08-18; stress test executed and folded into v0.7; research (17 topics), PRD, tech spec, sub-module intents, and acceptance test plan complete. REMAINING before implementation: per-constraint human sign-off (concrete_example + counter_example acknowledged — worked examples above are the material). Implementation is executed by a separate agent against these artifacts and reviewed post-hoc; ai_generated tests cannot self-certify (golden fixtures + human assertions per the test plan)."
