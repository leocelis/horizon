# memento_engine_intent.yaml — sub-module intent (segments b–e: evaluation, proposals,
# money, paths). Parent: ../horizon_memento_mori_intent.yaml (v1.0); its 7 constraints
# all apply. Tests: ../MEMENTO_MORI_TEST_PLAN.md (E-*).

parent_intent: "../horizon_memento_mori_intent.yaml"
scope: { level: "module", type: "component", granularity: "fine" }
metadata:
  feature_id: "memento_engine"
  category: "mission_dynamics"
  status: "implemented"

authorship:
  origin: "ai_proposed"
  human_oversight: "review_required"
  ai_authority:
    can_create: false
    can_modify: ["implementation", "verification"]
    requires_approval: ["constraints"]

intent:
  summary: "evaluate(store_snapshot, t_eval) → ClockReport: the pure clock surface — ages, TTL states, latencies, shares, proposals, money, path comparison"
  goal: |
    Deterministic evaluation pipeline per MEMENTO_MORI_TECH_SPEC.md §4. Every output
    row carries a derivation string and n where a summary appears; degradation on
    missing optional inputs is by omission with an explanatory field, never by
    substitution.

constraints:
  - name: "pure_function_injected_time"
    requirement: "evaluate() reads no ambient clock, no network, no LLM; the evaluation instant is a parameter; identical (snapshot, instant) yields a byte-identical serialized report"
    test: "tests/unit/memento_mori/test_engine_determinism.py::test_byte_identical_and_no_ambient_clock"   # plan E-7, E-8, E-9
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 2
    assumption_status: "KNOWN"
    consequence_if_violated: "The clock stops being a measurement; reports become irreproducible and untrustworthy as evidence"

  - name: "calendar_day_arithmetic"
    requirement: "Day counts are calendar-date subtractions on UTC-normalized dates; DST offsets and sub-day timestamps never change a day count; future-dated items clamp to age 0 with a future_dated flag, never negative"
    test: "tests/unit/memento_mori/test_engine_calendar.py::test_dst_and_future_dates"   # plan E-10, E-11 [GOLDEN]
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 2
    assumption_status: "ASSUMED"   # UTC-midnight normalization is a design choice; confirm at review
    consequence_if_violated: "Off-by-one ages around timezone boundaries make every downstream signal fire a day early or late"

  - name: "degrade_by_omission"
    requirement: "Missing rate → no monetary fields (non-monetary bytes identical); non-conserved window → λ=None and cycle counts instead of dates; empty comparable class → no proposal; unlabeled events → no wait/touch ratio. In every case an explanatory field states what was omitted and why; no value is ever substituted"
    test: "tests/unit/memento_mori/test_engine_degradation.py::test_omission_never_substitution"   # plan E-6, E-12, E-14, E-5
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    consequence_if_violated: "Silent substitution is estimation by the back door — the exact failure the plane exists to refuse"

  - name: "derivation_on_every_row"
    requirement: "Every report row exposes derivation (the arithmetic spelled out over named stored records) and n for any summary statistic — n is the SIZE OF THE POPULATION the statistic summarised (e.g. slowest_entity n == the number of entities the argmax ranged over), never a constant, and it must agree with the derivation string; monetary rows are traceable to (amount, rate, measured duration); comparison rows contain only latencies computed from really-run paths, base-rate fields separate and provenance-labelled"
    test: "tests/unit/memento_mori/test_engine_derivations.py::test_every_row_traceable"   # plan E-15, E-17, E-19 [GOLDEN]
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    consequence_if_violated: "Untraceable numbers acquire the authority of measurement without its accountability; a wrong input becomes indistinguishable from a wrong measurement"

  - name: "censored_latency_semantics"
    requirement: "slowest_entity is the argmax over ALL recorded entity sojourns, open and closed alike; an open winner is flagged censored (its recorded latency is a lower bound, research A2 F6) and never outranks a longer closed sojourn merely for being open; equal latencies break toward the open sojourn. The oldest OPEN sojourn is reported separately as blocking_entity (research B1 constraint-aged open item) — 'who is blocking now' and 'who was slowest' are distinct outputs that may name different entities. Exactly one implementation of this argmax exists; consumers read the engine's rows"
    test: "tests/unit/memento_mori/test_review_fixes.py::test_e23_open_sojourn_does_not_outrank_a_longer_closed_one"   # plan E-4, E-23, E-24 [GOLDEN/PROPERTY]; also test_e23_equal_latency_breaks_toward_the_open_sojourn, test_e24_signals_consume_the_engine_argmax_rather_than_recomputing
    test_provenance: "execution_derived"
    execution_oracle:
      kind: "golden_fixture"
      path: "tests/fixtures/memento_mori/smallco_golden.json"
      note: "Hand-checked E-4 values; corrected in v1.0 when the open-dominates rule was removed"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    conflict_prone: true
    anti_pattern: "Do NOT re-introduce 'an open sojourn dominates any closed one'. It reads as intuitive (the open item is what you can still act on) and it is what the first implementation did, but it makes a 1-day open entity outrank a 400-day closed one and silently redefines 'slowest' as 'currently open'. The currently-open question has its own field: blocking_entity."
    consequence_if_violated: "The plane's thesis signal names the wrong entity, and the operator attacks a latency that is not the largest recorded one"

  - name: "typed_refusals"
    requirement: "Requests for refused computations (NPV/discounting, currency conversion, forecast Δt or TTL, invented λ, counterfactual sojourns, inferential path dominance) raise typed refusal errors naming the violated rule; no code path returns an approximation instead"
    test: "tests/unit/memento_mori/test_engine_refusals.py::test_refusal_list_enforced"   # plan E-16, E-18 [HUMAN]
    test_provenance: "ai_generated"
    entropy: "near-zero"
    priority: 1
    assumption_status: "KNOWN"
    consequence_if_violated: "The refusal list decays into documentation; one obliging helper function reintroduces invented numbers"

constraint_satisfiability:
  analysis: |
    Six constraints; one tension examined: derivation_on_every_row vs
    degrade_by_omission — an omitted block still carries a derivation-shaped
    explanation field ("omitted: no conserved window"), so both are satisfied on the
    same report. Jointly satisfiable.
  joint_satisfaction_test: "tests/unit/memento_mori/test_engine_joint.py::test_all_engine_constraints_one_report"

verification:
  protocol: "Parent Rule-2 applies. Golden fixtures E-1/E-2/E-4/E-12/E-15/E-17/E-19 (hand-checked expected reports for the smallco fixture) are the execution-derived oracles; E-7/E-14 are property tests."
review_gate: { status: "PENDING_SIGNOFF" }
