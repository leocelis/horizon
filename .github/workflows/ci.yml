name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: horizon-minilm-v1-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt', 'pyproject.toml') }}

      - name: Pre-cache embedding model (offline tests)
        run: |
          export SENTENCE_TRANSFORMERS_HOME="${{ github.workspace }}/.cache/models"
          export HF_HOME="${{ github.workspace }}/.cache/models"
          mkdir -p "$SENTENCE_TRANSFORMERS_HOME"
          python - <<'PY'
          import os
          from sentence_transformers import SentenceTransformer
          cache = os.environ["SENTENCE_TRANSFORMERS_HOME"]
          m = SentenceTransformer("all-MiniLM-L6-v2", cache_folder=cache)
          m.encode(["warmup"])
          print(f"Model cached: {cache}")
          PY

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Run tests
        env:
          SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/models
          HF_HOME: ${{ github.workspace }}/.cache/models
        run: |
          pytest tests/unit tests/integration tests/e2e -q \
            --cov=horizon_monitor --cov-report=term-missing --cov-report=xml

      - name: Coverage report
        if: always()
        run: |
          echo "## Coverage summary (py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  compliance:
    name: TrustLint (EU AI Act)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TrustLint
        run: |
          python -m pip install --upgrade pip
          pip install 'trustlint>=2.0.1'

      - name: Scan LLM-facing artifacts
        run: chmod +x scripts/compliance/check.sh && ./scripts/compliance/check.sh

  compliance-runtime:
    name: ComplyEdge runtime (BYOK)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Runtime /v1/check probe
        env:
          COMPLYEDGE_API_KEY: ${{ secrets.COMPLYEDGE_API_KEY }}
        run: |
          if [ -z "${COMPLYEDGE_API_KEY:-}" ]; then
            echo "COMPLYEDGE_API_KEY not configured — skipping runtime probe"
            exit 0
          fi
          chmod +x scripts/compliance/runtime_check.sh
          ./scripts/compliance/runtime_check.sh
