name: Release

# Builds the sdist and wheel on every v* tag as a check. Publishing to PyPI is a
# manual twine upload of the same commit. Trusted publishing (OIDC) needs a
# publisher registered on the PyPI project first; until then a publish job here
# can only fail.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

